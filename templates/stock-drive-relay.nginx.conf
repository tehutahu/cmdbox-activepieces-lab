# REVIEW TEMPLATE ONLY. No container/network/hosts/SSRF setting is applied.
# Pin the reviewed official image and verify nginx -V/-t offline before activation.
worker_processes 1;
error_log /dev/null crit;
pid /tmp/nginx.pid;
events { worker_connections 64; }
stream {
    resolver 127.0.0.11 valid=300s ipv6=off;
    map $ssl_preread_server_name $google_upstream {
        default "";
        oauth2.googleapis.com oauth2.googleapis.com:443;
        www.googleapis.com www.googleapis.com:443;
    }
    server {
        listen 172.30.92.2:443;
        allow 172.30.92.3;
        deny all;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_timeout 30s;
        proxy_pass $google_upstream;
    }
}
