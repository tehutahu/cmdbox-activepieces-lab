worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
stream {
    upstream local_dummy_redis { server redis:6379; }
    server {
        listen 8080;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass local_dummy_redis;
    }
}
